<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400"
     xmlns="http://www.w3.org/2000/svg">
  <!--
    Trick van Staveren Photography watermark.

    Geometry notes:
      * Text bounding box (right-aligned): approx x=170-560, y=145-335.
      * Arc is a quarter-circle centered at the text center (380, 250),
        radius 220. It wraps the upper-left side of the text and ends
        at the top above x=380, where the rocket sits pointing right
        (tangent at the top of a CCW orbit).
      * The trail fades from transparent at its launch end to full peach
        at the rocket's nose so it reads as exhaust.
      * Everything shares the same drop shadow so the peach mark stays
        legible against light backgrounds (sky, sand, snow).
  -->
  <defs>
    <!-- Strong dark drop shadow for legibility on light backgrounds
         (sky, sand, seafoam). Built from a blurred SourceAlpha, with
         the alpha curve pushed above 1 so the shadow stays opaque
         under the lighter areas of the text. -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dx="3" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="2.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Trail fade: launch end transparent, rocket end opaque.
         Aligned along the chord from launch point to rocket point. -->
    <linearGradient id="trailFade" gradientUnits="userSpaceOnUse"
                    x1="160" y1="250" x2="380" y2="30">
      <stop offset="0%"   stop-color="#FFCEC0" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#FFCEC0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFCEC0" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- 90 degree arc, centered on the text, wrapping the upper-left. -->
  <g filter="url(#shadow)">
    <path d="M 160,250 A 220,220 0 0 1 380,30"
          fill="none"
          stroke="url(#trailFade)"
          stroke-width="5"
          stroke-linecap="round"/>
  </g>

  <!-- Little narrow rocket at the head of the arc, pointing right
       along the tangent of the orbit. Drawn pointing along +X. -->
  <g filter="url(#shadow)" transform="translate(380 30)">
    <!-- exhaust flame -->
    <path d="M -22,-4 L -40,0 L -22,4 Z" fill="#FFCEC0" opacity="0.9"/>
    <!-- body -->
    <rect x="-22" y="-5" width="20" height="10" rx="1.5" fill="#FFCEC0"/>
    <!-- nose cone -->
    <path d="M -2,-5 L 12,0 L -2,5 Z" fill="#FFCEC0"/>
    <!-- fins -->
    <path d="M -20,-5 L -28,-10 L -14,-5 Z" fill="#FFCEC0"/>
    <path d="M -20, 5 L -28, 10 L -14, 5 Z" fill="#FFCEC0"/>
    <!-- porthole -->
    <circle cx="-10" cy="0" r="1.8" fill="#7a4438"/>
  </g>

  <!-- Branding text, right-aligned. -->
  <g filter="url(#shadow)"
     fill="#FFCEC0"
     font-family="Lato, 'Helvetica Neue', Arial, sans-serif"
     font-weight="700"
     text-anchor="end">
    <text x="560" y="195" font-size="46">Trick</text>
    <text x="560" y="250" font-size="46">van Staveren</text>
    <text x="560" y="305" font-size="46">Photography</text>
  </g>
</svg>
